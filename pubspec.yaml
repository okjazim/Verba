name: verba
description: "Community-driven, open-source language learning application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  get_it: ^8.0.2
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFF3EB"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#FFF3EB"
  image: assets/logo_trans.png
  android_gravity: center
  android_12:
    icon_background_color: "#FFF3EB"
    image: assets/logo_trans.png
